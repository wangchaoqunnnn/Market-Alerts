services:
  # ============================================
  # 主应用服务
  # ============================================
  app:
    image: market-anomaly-monitor:latest
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      args:
        # 以下 4 项都可在 deployment/.env 里配置（compose 会自动读取），
        # 或在命令行用环境变量覆盖：NPM_REGISTRY=... ./deploy.sh build
        # npm 镜像源（云厂商内网源免流量且更快）
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NPM_FALLBACK_REGISTRY: ${NPM_FALLBACK_REGISTRY:-https://registry.npmjs.org}
        # npm 并发连接数（内网源可调到 16-32 提速；公网源建议 <= 8 避免被限流）
        NPM_MAXSOCKETS: ${NPM_MAXSOCKETS:-6}
        # 基础镜像（境内拉 Docker Hub 慢时换成国内镜像仓库前缀）
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    container_name: market-anomaly-monitor
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # 必须监听 0.0.0.0：代码默认 localhost 只绑定 127.0.0.1，
      # 容器外（宿主机/浏览器）将无法访问映射出去的 3000 端口
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=3000
      # 日志目录（应用写 <LOG_DIR>/server.log），容器内默认 /app/logs
      - LOG_DIR=/app/logs
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 时区同步
      - /etc/localtime:/etc/localtime:ro
    networks:
      - app-network
    healthcheck:
      # 镜像内不再安装 curl，统一用 busybox 自带的 wget（HTTP 错误码返回非 0）
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================
  # PostgreSQL 数据库
  # ============================================
  db:
    # 境内拉取 Docker Hub 慢时，可在 .env 里把镜像换成国内仓库前缀
    # 例如 POSTGRES_IMAGE=docker.m.daocloud.io/library/postgres:16-alpine
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: market-anomaly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass}
      POSTGRES_DB: ${DB_NAME:-app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # 仅绑定本机回环，避免数据库端口暴露到公网（宿主机 psql/pg_dump 仍可用）
      # 如需局域网直连，改成 "5432:5432"
      - "127.0.0.1:5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # Nginx 反向代理（可选，取消注释启用）
  # 提供 gzip 压缩、静态资源缓存、HTTPS 终止
  # ============================================
  # nginx:
  #   image: nginx:alpine
  #   container_name: market-anomaly-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #     - /etc/localtime:/etc/localtime:ro
  #   depends_on:
  #     - app
  #   networks:
  #     - app-network

volumes:
  postgres-data:
    name: market-anomaly-postgres-data

networks:
  app-network:
    driver: bridge
    name: market-anomaly-network
