version: "3.8"

services:
  # ============================================
  # 主应用服务
  # ============================================
  app:
    image: market-anomaly-monitor:latest
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: market-anomaly-monitor
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 时区同步
      - /etc/localtime:/etc/localtime:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================
  # PostgreSQL 数据库
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: market-anomaly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass}
      POSTGRES_DB: ${DB_NAME:-app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # Nginx 反向代理（可选，取消注释启用）
  # 提供 gzip 压缩、静态资源缓存、HTTPS 终止
  # ============================================
  # nginx:
  #   image: nginx:alpine
  #   container_name: market-anomaly-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #     - /etc/localtime:/etc/localtime:ro
  #   depends_on:
  #     - app
  #   networks:
  #     - app-network

volumes:
  postgres-data:
    name: market-anomaly-postgres-data

networks:
  app-network:
    driver: bridge
    name: market-anomaly-network
